name: Publish Manual Blog Article

# Percorso di FALLBACK senza credito Anthropic, END-TO-END in UN solo dispatch:
# promuove l'articolo gia' scritto a mano in _data/blog/_manual/ (5 lingue) ->
# matcha i prodotti correlati via AliExpress (NO Anthropic) -> traduce i
# prodotti _article in argos -> commit unico -> dispatcha deploy.yml.
# NIENTE ANTHROPIC_API_KEY in nessuno step: zero credito.

on:
  workflow_dispatch:

concurrency:
  group: generate-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Promote manual article
        run: python _scripts/publish_manual_article.py

      - name: Fetch article products
        env:
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python _scripts/fetch_products.py --articles-only

      - name: Translate products to active languages
        run: |
          langs=$(jq -r '.languages[] | select(. != "en")' _data/config.json)
          if [ -z "$langs" ]; then
            echo "No non-en languages active in config.languages, skipping translation"
            exit 0
          fi
          pip install argostranslate
          for lang in $langs; do
            echo "$lang active: installing argos en->$lang package"
            python _scripts/ci_install_argos.py --lang "$lang"
            python _scripts/translate_content.py --lang "$lang"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: publish manual blog article + products"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i failed, retrying..."
            sleep 5
          done
          echo "push failed after 3 attempts" >&2
          exit 1

      - name: Trigger deploy
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
