name: Social Video (DRY_RUN)

# Renders one animated Product Spotlight reel (silent, 9:16, motion graphics via
# Remotion) from the catalog and uploads it as a run artifact for preview.
# No publishing, no secrets.

on:
  workflow_dispatch:
    inputs:
      lang:
        description: "Language: en | it | es | de | fr"
        type: string
        required: false
        default: "en"
      slug:
        description: "Product slug (optional; default = best discounted product)"
        type: string
        required: false
        default: ""

concurrency:
  group: social-video
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: social/remotion/package.json

      - name: Install Python deps
        run: pip install requests

      - name: Install Remotion deps
        working-directory: social/remotion
        run: npm ci || npm install

      - name: Bundle fonts into Remotion public dir
        run: |
          mkdir -p social/remotion/public/fonts
          cp assets/fonts/DejaVuSans.ttf social/remotion/public/fonts/
          cp assets/fonts/DejaVuSans-Bold.ttf social/remotion/public/fonts/

      - name: Build reel props (DRY_RUN, Python)
        run: |
          slug_arg=""
          if [ -n "${{ inputs.slug }}" ]; then
            slug_arg="--slug ${{ inputs.slug }}"
          fi
          python _scripts/generate_social_video.py --lang "${{ inputs.lang }}" $slug_arg --no-video

      - name: Resolve props file
        id: props
        run: |
          file=$(ls out/social/*-${{ inputs.lang }}.props.json | head -n1)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          stem=$(basename "$file" .props.json)
          echo "stem=$stem" >> "$GITHUB_OUTPUT"

      - name: Render reel (Remotion)
        working-directory: social/remotion
        run: |
          npx remotion render ProductSpotlight \
            "../../out/social/${{ steps.props.outputs.stem }}.mp4" \
            "--props=../../${{ steps.props.outputs.file }}"

      - name: Show approval payload (mock, no token)
        run: |
          slug_arg=""
          if [ -n "${{ inputs.slug }}" ]; then
            slug_arg="--slug ${{ inputs.slug }}"
          fi
          python _scripts/social_bot.py --lang "${{ inputs.lang }}" $slug_arg --simulate approve

      - name: Upload reel + caption + props artifact
        uses: actions/upload-artifact@v4
        with:
          name: social-video-${{ inputs.lang }}
          path: |
            out/social/*.mp4
            out/social/*.caption.txt
            out/social/*.props.json
          if-no-files-found: error
          retention-days: 14
