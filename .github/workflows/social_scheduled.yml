name: Social Scheduled Publish

# Walks the scheduled queue (out/social/_scheduled/) and publishes any job whose
# scheduled_at <= now (Europe/Rome). Default is DRY_RUN: nothing goes out unless
# SOCIAL_LIVE=1 and the platform secrets are present. Runs every 15 minutes.
#
# NOTE: out/social/ is gitignored, so the queue is NOT persisted in the repo. To
# publish on a real schedule, persist the queue (artifact/cache/object store) or
# run this on a host that keeps out/social/_scheduled/. As-is this is the wiring;
# the runner is also dispatchable manually for testing.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: social-scheduled
  cancel-in-progress: false

jobs:
  publish-scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install requests

      - name: Run scheduled publisher
        env:
          # DRY_RUN unless SOCIAL_LIVE=1 is set as a secret. Secrets are passed
          # here only as env; they are never committed.
          SOCIAL_LIVE: ${{ secrets.SOCIAL_LIVE }}
          SOCIAL_BOT_TOKEN: ${{ secrets.SOCIAL_BOT_TOKEN }}
          SOCIAL_ADMIN_CHAT_ID: ${{ secrets.SOCIAL_ADMIN_CHAT_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_FB_PAGE_ID: ${{ secrets.META_FB_PAGE_ID }}
        run: python _scripts/social_bot.py --run-scheduled
