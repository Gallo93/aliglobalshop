name: Generate Blog Article

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 15 * * *'

concurrency:
  group: generate-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python _scripts/generate_blog.py

      - name: Translate content to IT
        run: |
          if jq -e '.languages | index("it")' _data/config.json > /dev/null; then
            echo "IT active: installing argostranslate + en_it package"
            pip install argostranslate
            python - <<'PY'
import argostranslate.package as pkg
pkg.update_package_index()
available = pkg.get_available_packages()
match = next((p for p in available if p.from_code == "en" and p.to_code == "it"), None)
if match is None:
    raise SystemExit("en->it argos package not found in index")
pkg.install_from_path(match.download())
print("installed en->it argos package")
PY
            python _scripts/translate_content.py --lang it
          else
            echo "IT not active in config.languages, skipping translation"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: generate blog article [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i failed, retrying..."
            sleep 5
          done
          echo "push failed after 3 attempts" >&2
          exit 1
