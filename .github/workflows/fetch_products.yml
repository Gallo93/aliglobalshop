name: Fetch Products
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'  # 02:00 Europe/Rome = 01:00 UTC

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch products
        env:
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python _scripts/fetch_products.py
      - name: Translate content to IT
        run: |
          if jq -e '.languages | index("it")' _data/config.json > /dev/null; then
            echo "IT active: installing argostranslate + en_it package"
            pip install argostranslate
            python - <<'PY'
import argostranslate.package as pkg
pkg.update_package_index()
available = pkg.get_available_packages()
match = next((p for p in available if p.from_code == "en" and p.to_code == "it"), None)
if match is None:
    raise SystemExit("en->it argos package not found in index")
pkg.install_from_path(match.download())
print("installed en->it argos package")
PY
            python _scripts/translate_content.py --lang it
          else
            echo "IT not active in config.languages, skipping translation"
          fi
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/
          git diff --staged --quiet || (git commit -m "chore: update products [skip ci]" && git pull --rebase origin main && git push)
      - name: Trigger site rebuild
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
