<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{title}} | {{site_title}}</title>
  <meta name="description" content="{{meta_description}}">
  <link rel="canonical" href="{{site_url}}/en/blog/{{slug}}/">
  <link rel="stylesheet" href="{{site_url}}/assets/css/style.css">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{meta_description}}">
  <meta property="og:type" content="article">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","headline":"{{title}}","datePublished":"{{date}}","author":{"@type":"Organization","name":"{{site_title}}"},"publisher":{"@type":"Organization","name":"{{site_title}}","logo":{"@type":"ImageObject","url":"{{site_url}}/assets/img/logo.png"}},"mainEntityOfPage":{"@type":"WebPage","@id":"{{site_url}}/en/blog/{{slug}}/"}}</script>
</head>
<body>
  <header class="nav">
    <div class="nav__inner">
      <a class="nav__logo" href="{{site_url}}/en/">{{site_title}}</a>
      <nav class="nav__links" aria-label="Primary">
        <a href="{{site_url}}/en/electronics/">Electronics</a>
        <a href="{{site_url}}/en/smart-home/">Smart Home</a>
        <a href="{{site_url}}/en/sport/">Sport</a>
        <a href="{{site_url}}/en/gadgets/">Gadgets</a>
        <a href="{{site_url}}/en/flash-sale/">Flash Sale</a>
        <a href="{{site_url}}/en/coupons/">Coupons</a>
        <a href="{{site_url}}/en/blog/">Blog</a>
      </nav>
    </div>
  </header>

  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <a href="{{site_url}}/en/">Home</a> <span>/</span>
    <a href="{{site_url}}/en/blog/">Blog</a> <span>/</span>
    <span aria-current="page">{{title_short}}</span>
  </nav>

  <main class="container article">
    <article>
      <h1 class="article__title">{{title}}</h1>
      <p class="article__meta"><time datetime="{{date}}">{{date}}</time> · {{reading_time_min}} min read</p>
      <div class="article__body">
        {{content_html}}
      </div>
    </article>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <p>&copy; {{year}} {{site_title}}. Affiliate disclosure: we earn commissions from qualifying AliExpress purchases.</p>
    </div>
  </footer>
</body>
</html>
